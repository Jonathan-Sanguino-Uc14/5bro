<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<title>Recibo de Caja — Auth</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#C8C5BF;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'IBM Plex Mono',monospace;}
  .phone{width:390px;height:844px;background:#F7F5F0;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;}

  /* Receipt paper edges */
  .top-edge{width:100%;height:12px;background:repeating-linear-gradient(90deg,#F7F5F0 0,#F7F5F0 8px,#E8E5DF 8px,#E8E5DF 9px,#F7F5F0 9px,#F7F5F0 12px);flex-shrink:0;}
  .side-shadow-l{position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(90deg,#00000012,transparent);}
  .side-shadow-r{position:absolute;right:0;top:0;bottom:0;width:4px;background:linear-gradient(-90deg,#00000012,transparent);}

  /* Receipt body */
  .receipt{width:100%;max-width:320px;padding:20px 0;display:flex;flex-direction:column;align-items:center;flex:1;}

  .logo-area{text-align:center;margin-bottom:4px;}
  .store-name{font-size:22px;font-weight:700;letter-spacing:.04em;color:#111;text-transform:uppercase;}
  .store-sub{font-size:9px;color:#888;letter-spacing:.18em;text-transform:uppercase;margin-top:3px;}

  .receipt-line{width:100%;border-top:1px dashed #bbb;margin:14px 0;}
  .receipt-line.double{border-top:3px double #444;margin:12px 0;}

  .receipt-row{display:flex;justify-content:space-between;width:100%;font-size:10px;color:#555;letter-spacing:.06em;margin:2px 0;text-transform:uppercase;}
  .receipt-row.header-row{color:#111;font-weight:700;font-size:9px;letter-spacing:.14em;margin-bottom:2px;}

  .field-block{width:100%;margin:6px 0;}
  .field-label{font-size:8px;color:#888;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px;}
  .field-input{width:100%;border:none;border-bottom:1px solid #bbb;background:transparent;font-family:'IBM Plex Mono',monospace;font-size:14px;color:#111;padding:6px 0;outline:none;}
  .field-input.placeholder{color:#bbb;}

  .cta{width:100%;background:#111;color:#F7F5F0;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.18em;text-align:center;padding:14px 0;text-transform:uppercase;margin-top:16px;cursor:pointer;}

  .or-row{font-size:8px;color:#bbb;letter-spacing:.2em;text-transform:uppercase;margin:14px 0 10px;}
  .alt-row{display:flex;gap:8px;width:100%;}
  .alt-item{flex:1;border:1px dashed #bbb;padding:9px 4px;text-align:center;font-size:8px;color:#888;letter-spacing:.12em;text-transform:uppercase;}

  .barcode{margin:16px 0 4px;display:flex;gap:1px;align-items:flex-end;}
  .barcode span{display:inline-block;width:2px;background:#333;}
  .receipt-no{font-size:8px;color:#bbb;letter-spacing:.12em;margin-top:2px;}

  .bottom-edge{width:100%;margin-top:auto;padding:0 0 2px;}
  .zigzag{width:100%;height:10px;background:linear-gradient(135deg,#F7F5F0 33.33%,transparent 33.33%) 0 0,linear-gradient(225deg,#F7F5F0 33.33%,transparent 33.33%) 0 0,linear-gradient(315deg,#F7F5F0 33.33%,transparent 33.33%) 0 0,linear-gradient(45deg,#F7F5F0 33.33%,transparent 33.33%) 0 0;background-color:#C8C5BF;background-size:10px 10px;background-position:0 0,5px 0,5px -5px,0px 5px;}
</style>
</head>
<body>
<div class="phone">
  <div class="top-edge"></div>
  <div class="side-shadow-l"></div>
  <div class="side-shadow-r"></div>
  <div class="receipt">
    <div class="logo-area">
      <div class="store-name">leticIA</div>
      <div class="store-sub">Control financiero · Tu negocio</div>
    </div>

    <div class="receipt-line"></div>

    <div class="receipt-row header-row"><span>Acceso al sistema</span><span>Cuenta propia</span></div>
    <div class="receipt-row"><span>Tipo de usuario</span><span>Emprendedor</span></div>
    <div class="receipt-row"><span>Módulo</span><span>Auth / Login</span></div>

    <div class="receipt-line"></div>

    <div class="field-block">
      <div class="field-label">Correo electrónico</div>
      <div class="field-input placeholder">nombre@negocio.com</div>
    </div>
    <div class="field-block">
      <div class="field-label">Contraseña</div>
      <div class="field-input placeholder">••••••••</div>
    </div>

    <div class="receipt-line double"></div>

    <div class="cta">▶ INGRESAR</div>

    <div class="or-row">— O CONTINÚA CON —</div>
    <div class="alt-row">
      <div class="alt-item">G · Google</div>
      <div class="alt-item">⬡ · Biometría</div>
    </div>

    <div class="receipt-line"></div>
    <div class="receipt-row"><span>¿Primera vez?</span><span>Crear cuenta →</span></div>

    <div class="barcode">
      <span style="height:28px;"></span><span style="height:40px;"></span><span style="height:32px;"></span><span style="height:40px;width:4px;"></span><span style="height:28px;"></span><span style="height:36px;"></span><span style="height:40px;"></span><span style="height:24px;"></span><span style="height:40px;width:3px;"></span><span style="height:32px;"></span><span style="height:40px;"></span><span style="height:28px;"></span><span style="height:40px;width:4px;"></span><span style="height:36px;"></span><span style="height:28px;"></span><span style="height:40px;"></span>
    </div>
    <div class="receipt-no">LETICIA-2026-AUTH-001</div>
  </div>
  <div class="bottom-edge"><div class="zigzag"></div></div>
</div>
</body>
</html>
