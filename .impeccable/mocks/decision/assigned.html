<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<title>Boarding Pass — Auth</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#D1CEC9;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'IBM Plex Sans',sans-serif;}
  .phone{width:390px;height:844px;background:#F5F3EF;overflow:hidden;position:relative;display:flex;flex-direction:column;}

  /* Header — dark gate panel */
  .header{background:#1A1A1A;padding:52px 28px 24px;flex-shrink:0;}
  .carrier{color:#8A8680;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px;}
  .app-name{color:#F5F3EF;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1;}
  .tagline{color:#8A8680;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:8px;}
  .gate-info{display:flex;gap:20px;margin-top:20px;}
  .gate-cell label{color:#8A8680;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:3px;}
  .gate-cell span{color:#F5F3EF;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;}

  /* Perforation */
  .perf{height:1px;background:repeating-linear-gradient(90deg,#8A868044 0,#8A868044 6px,transparent 6px,transparent 10px);margin:0 -2px;flex-shrink:0;}
  .perf-row{display:flex;align-items:center;flex-shrink:0;}
  .notch{width:18px;height:18px;border-radius:50%;background:#D1CEC9;flex-shrink:0;}
  .perf-line{flex:1;height:1px;background:repeating-linear-gradient(90deg,#1A1A1A22 0,#1A1A1A22 4px,transparent 4px,transparent 8px);}

  /* Body — ticket stub */
  .body{flex:1;padding:28px 28px 20px;display:flex;flex-direction:column;gap:0;}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#8A8680;margin-bottom:6px;margin-top:20px;}
  .section-label:first-child{margin-top:0;}
  .field{border-bottom:1.5px solid #1A1A1A1A;padding:10px 0 8px;font-size:15px;color:#1A1A1A;font-weight:500;background:transparent;}
  .field-placeholder{color:#8A8680;font-weight:400;}

  /* CTA */
  .cta{margin-top:28px;background:#F5A623;color:#1A1A1A;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:16px;cursor:pointer;}

  /* OR divider */
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
  .divider-line{flex:1;height:1px;background:repeating-linear-gradient(90deg,#1A1A1A22 0,#1A1A1A22 3px,transparent 3px,transparent 6px);}
  .divider-text{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;color:#8A8680;text-transform:uppercase;}

  /* Alternate gates */
  .alt-gates{display:flex;gap:10px;}
  .alt-btn{flex:1;border:1.5px solid #1A1A1A22;padding:12px 8px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;color:#1A1A1A;text-transform:uppercase;}
  .alt-btn .icon{font-size:14px;display:block;margin-bottom:4px;}

  /* Footer stub */
  .footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #1A1A1A22;padding-top:14px;}
  .footer-link{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8A8680;text-decoration:underline;text-decoration-style:dotted;}
  .flight-code{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#1A1A1A33;letter-spacing:.06em;}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="carrier">Registro comercial digital</div>
    <div class="app-name">leticIA</div>
    <div class="tagline">Tu negocio en claro</div>
    <div class="gate-info">
      <div class="gate-cell"><label>Acceso</label><span>Cuenta personal</span></div>
      <div class="gate-cell"><label>Tipo</label><span>Emprendedor</span></div>
    </div>
  </div>

  <div class="perf-row">
    <div class="notch"></div>
    <div class="perf-line"></div>
    <div class="notch"></div>
  </div>

  <div class="body">
    <div class="section-label">Correo electrónico</div>
    <div class="field field-placeholder">nombre@negocio.com</div>

    <div class="section-label">Contraseña</div>
    <div class="field field-placeholder">••••••••</div>

    <div class="cta">INGRESAR ▶</div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">O usa puerta alterna</div>
      <div class="divider-line"></div>
    </div>

    <div class="alt-gates">
      <div class="alt-btn"><span class="icon">G</span>Google</div>
      <div class="alt-btn"><span class="icon">⬡</span>Biometría</div>
    </div>

    <div class="footer">
      <span class="footer-link">Nueva reserva →</span>
      <span class="flight-code">leticIA / AUTH-01</span>
    </div>
  </div>
</div>
</body>
</html>
